        align-content: center;
        justify-content: center;
        position: relative;
    } p {

		width: 100%;

        flex-wrap: wrap;
        gap: 12px;
	} figure {
		margin: 12px;
	} img, .zoom {
		width: 200px;
		height: 200px;
        border: 5px solid hsla(358,65%,81%,1.00);
        transition: transform 0.5;
	} figcaption {
		font: 12pt/1.4em "Luxurious Roman";
        font-weight: 600;
        width: 100%;
        text-align: center;
	} img:hover {
        transform: scale(1.03);
        transition: transform 0.5s;
    } .zoom:hover {
        background-size: 105%;
        transition: background-size 0.5s;
    } @media only screen and (max-width: 750px) {
        p {
            width: 90%;
            margin: 36px auto;
