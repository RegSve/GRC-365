<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>TwstGrid</title>
	<style>
        @import url("https://use.typekit.net/zxc8hho.css");
    body {
        background: antiquewhite;
    } h1 {
        font: 36pt/1.4em "boucherie-flared";
        color: royalblue;
        text-align: center;
		font-style: bold;
        margin-bottom: -12px;
    } #container {
        width: 900px;
        height: auto;
        margin: 0 auto;
        margin-bottom: 48px;
        display: grid;
        grid-template: repeat(4,300px)/repeat(3,300px);
    } #container div:nth-child(2) {
        grid-column: span 2;
    } #container div:nth-child(2) {
        grid-column: span 2;
	} #container div:nth-child(2) {
        grid-column: span 1;
    } #container div:nth-child(4) {
        grid-column: span 2;
        grid-row: span 2;
    } #container div:nth-child(5) {
        display: none;
    } #container div:nth-child(7) {
        display: none;
    } #container div:nth-child(8) {
        display: none;
    } #container div:nth-child(9) {
        grid-row: span 2;
	} #container div:nth-child(9) {
        grid-row: span 1;	
    }
    } #container div:nth-child(12) {
        display: none;
    }
</style>
</head>
<h1>Night Raven College Dorms</h1>
